services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: horeca
      POSTGRES_PASSWORD: horeca
      POSTGRES_DB: horeca
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U horeca -d horeca"]
      interval: 3s
      timeout: 3s
      retries: 15

  api:
    build: .
    ports:
      - "8000:8000"
    # Cloudinary creds are interpolated from `backend/.env` (gitignored, loaded
    # automatically by Compose) or the host env — never baked into this file.
    environment:
      DATABASE_URL: postgresql+asyncpg://horeca:horeca@db:5432/horeca
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
