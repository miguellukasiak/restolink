services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: horeca
      POSTGRES_PASSWORD: horeca
      POSTGRES_DB: horeca
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U horeca -d horeca"]
      interval: 3s
      timeout: 3s
      retries: 15

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://horeca:horeca@db:5432/horeca
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
